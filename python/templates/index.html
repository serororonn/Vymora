<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio2MIDI Local</title>
  <style>
    :root { color-scheme: light; --ink: #172126; --muted: #65727a; --paper: #f4f0e7; --panel: #fffdf8; --accent: #d95d39; --line: #ded7ca; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: Georgia, "Yu Mincho", serif; background: radial-gradient(circle at 15% 10%, #fff8df 0, transparent 35%), linear-gradient(135deg, var(--paper), #e6edf0); }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 8vh 0 10vh; }
    header { margin-bottom: 36px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 7vw, 76px); line-height: .95; font-weight: 500; }
    .intro { max-width: 540px; margin: 20px 0 0; color: var(--muted); font: 16px/1.7 Arial, sans-serif; }
    form { display: grid; grid-template-columns: 1.3fr .7fr; gap: 20px; align-items: start; }
    .panel { background: rgba(255,253,248,.88); border: 1px solid var(--line); padding: 28px; box-shadow: 12px 14px 0 rgba(23,33,38,.06); }
    .upload { min-height: 260px; display: flex; flex-direction: column; justify-content: center; border: 1px dashed #b9afa0; background: rgba(255,255,255,.28); cursor: pointer; }
    .upload:hover { border-color: var(--accent); }
    input[type=file] { width: 100%; font: 14px Arial, sans-serif; }
    label { display: block; margin: 0 0 18px; font: 700 12px Arial, sans-serif; color: var(--muted); }
    input[type=number] { display: block; width: 100%; margin-top: 7px; padding: 11px 12px; border: 1px solid var(--line); color: var(--ink); background: #fff; font: 15px Arial, sans-serif; }
    select { display: block; width: 100%; margin-top: 7px; padding: 11px 12px; border: 1px solid var(--line); color: var(--ink); background: #fff; font: 15px Arial, sans-serif; }
    .settings h2 { margin: 0 0 24px; font-size: 22px; font-weight: 500; }
    button { width: 100%; padding: 15px 18px; border: 0; color: white; background: var(--accent); cursor: pointer; font: 700 14px Arial, sans-serif; }
    button:hover { background: #b9432b; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; margin: 20px 0 0; color: var(--muted); font: 14px/1.5 Arial, sans-serif; }
    .progress-wrap { display: none; margin: 18px 0 0; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font: 12px Arial, sans-serif; }
    progress { width: 100%; height: 9px; accent-color: var(--accent); }
    .hint { margin: 20px 0 0; color: var(--muted); font: 12px/1.5 Arial, sans-serif; }
    @media (max-width: 680px) { main { padding-top: 42px; } form { grid-template-columns: 1fr; } .panel { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local audio experiment</p>
      <h1>Audio<br>to MIDI</h1>
      <p class="intro">音源を個別ステムへ分離し、Basic Pitchで重なった音も含めてMIDIトラックへ変換します。出力後はDAWで調整できます。</p>
    </header>
    <form id="transcribe-form">
      <label class="panel upload" for="audio">
        音声ファイルを選択
        <input id="audio" name="audio" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a,audio/*" required>
        <span class="hint">WAV / MP3 / FLAC / OGG / M4A</span>
      </label>
      <section class="panel settings">
        <h2>変換設定</h2>
        <label>変換モード
          <select name="mode">
            <option value="multitrack">楽器別マルチトラック</option>
            <option value="single">単一トラック（高速）</option>
          </select>
        </label>
        <label>サンプルレート<input name="sr" type="number" value="16000" min="1"></label>
        <label>最低周波数 (Hz)<input name="fmin" type="number" value="65" min="1" step="0.1"></label>
        <label>最高周波数 (Hz)<input name="fmax" type="number" value="2093" min="1" step="0.1"></label>
        <label>ホップ長<input name="hop" type="number" value="256" min="1"></label>
        <label>テンポ (BPM、0は自動)<input name="tempo" type="number" value="0" min="0" step="0.1"></label>
        <button id="submit" type="submit">MIDIに変換する</button>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-meta"><span id="progress-message">準備中...</span><span id="progress-value">0%</span></div>
          <progress id="progress" max="100" value="0"></progress>
        </div>
        <p id="status" role="status"></p>
      </section>
    </form>
  </main>
  <script>
    const form = document.querySelector('#transcribe-form');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const progressWrap = document.querySelector('#progress-wrap');
    const progress = document.querySelector('#progress');
    const progressValue = document.querySelector('#progress-value');
    const progressMessage = document.querySelector('#progress-message');

    const waitForJob = async (jobId) => {
      while (true) {
        const response = await fetch(`/progress/${jobId}`);
        const job = await response.json();
        progress.value = job.progress || 0;
        progressValue.textContent = `${job.progress || 0}%`;
        progressMessage.textContent = job.message || '';
        if (job.status === 'completed') return;
        if (job.status === 'error') throw new Error(job.message || '変換に失敗しました。');
        await new Promise((resolve) => setTimeout(resolve, 700));
      }
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      progressWrap.style.display = 'block';
      progress.value = 0;
      progressValue.textContent = '0%';
      status.textContent = '音声の長さによって数分かかる場合があります。';
      try {
        const response = await fetch('/transcribe', { method: 'POST', body: new FormData(form) });
        if (response.status !== 202) {
          const result = await response.json();
          throw new Error(result.error || '変換に失敗しました。');
        }
        const { job_id: jobId } = await response.json();
        await waitForJob(jobId);
        const result = await fetch(`/download/${jobId}`);
        if (!result.ok) throw new Error('MIDIのダウンロードに失敗しました。');
        const blob = await result.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = result.headers.get('Content-Disposition')?.match(/filename="?([^";]+)"?/)?.[1] || 'transcribed.mid';
        link.click();
        URL.revokeObjectURL(url);
        status.textContent = '変換完了。MIDIをダウンロードしました。';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
